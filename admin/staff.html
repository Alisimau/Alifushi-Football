<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haveeru Kulhun League - Staff Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.header{background:#111827;color:white;padding:25px 20px;text-align:center}
.header h1{margin:0;font-size:28px}
.header p{margin:7px 0 0;color:#d1d5db}
.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.nav a,.logout-btn{color:white;text-decoration:none;background:rgba(255,255,255,.12);padding:9px 13px;border-radius:8px;font-size:14px;font-weight:bold;border:0;cursor:pointer}
.nav a:hover,.logout-btn:hover{background:rgba(255,255,255,.22)}
.staffbar{max-width:1100px;margin:15px auto 0;padding:0 15px;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:13px}
.staff-email{color:#374151;background:white;padding:8px 12px;border-radius:8px}
.logout-btn{background:#dc2626}
.container{max-width:900px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
button.primary{padding:12px 18px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button.primary:hover{background:#1d4ed8}
button.danger{padding:8px 12px;border:0;border-radius:7px;background:#dc2626;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin-top:15px;padding:12px;border-radius:8px}
.success{display:block;background:#ecfdf5;color:#047857}
.error{display:block;background:#fef2f2;color:#b91c1c}
.loading{text-align:center;color:#6b7280;padding:20px}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th{background:#1f2937;color:white;padding:12px;text-align:left;font-size:13px}
td{padding:12px;border-bottom:1px solid #e5e7eb}
.role-admin{font-weight:bold;color:#7c3aed}
.role-staff{font-weight:bold;color:#2563eb}
.empty{text-align:center;color:#6b7280;padding:25px}
.note{font-size:13px;color:#6b7280;margin-top:8px}
@media(max-width:700px){
 .form-grid{grid-template-columns:1fr}
 .staffbar{justify-content:center;flex-wrap:wrap}
 .header h1{font-size:23px}
}
</style>

<style id="liquid-glass-staff">
:root{--glass-line:rgba(255,255,255,.22);--glass-muted:rgba(226,232,240,.72)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
 margin:0!important;color:#f8fafc!important;
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important;
 background:
 radial-gradient(circle at 10% 10%,rgba(56,189,248,.28),transparent 32%),
 radial-gradient(circle at 90% 20%,rgba(139,92,246,.30),transparent 30%),
 radial-gradient(circle at 50% 100%,rgba(14,165,233,.20),transparent 35%),
 linear-gradient(135deg,#07111f,#0b1220 48%,#111827)!important;
 background-attachment:fixed;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;
 background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);
 background-size:24px 24px;
}
.header{
 background:rgba(15,23,42,.42)!important;
 border-bottom:1px solid var(--glass-line)!important;
 backdrop-filter:blur(28px) saturate(150%)!important;
 -webkit-backdrop-filter:blur(28px) saturate(150%)!important;
 box-shadow:0 18px 60px rgba(0,0,0,.22)!important;
 position:relative;z-index:2;
}
.header p,.staff-email,.note,.empty,.loading{color:var(--glass-muted)!important}
.nav a{
 color:#fff!important;background:rgba(255,255,255,.08)!important;
 border:1px solid var(--glass-line)!important;border-radius:12px!important;
 backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 25px rgba(0,0,0,.12)!important;
 transition:.2s;
}
.nav a:hover{background:rgba(255,255,255,.18)!important;transform:translateY(-1px)}
.container,.staffbar{position:relative;z-index:1}
.card{
 background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.07))!important;
 border:1px solid var(--glass-line)!important;border-radius:22px!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 55px rgba(0,0,0,.20)!important;
 backdrop-filter:blur(24px) saturate(150%)!important;
 -webkit-backdrop-filter:blur(24px) saturate(150%)!important;
 color:#fff!important;
}
.card h2{color:#fff!important}
input{
 background:rgba(255,255,255,.09)!important;color:#fff!important;
 border:1px solid var(--glass-line)!important;border-radius:12px!important;
 backdrop-filter:blur(15px)!important;-webkit-backdrop-filter:blur(15px)!important;
}
input::placeholder{color:rgba(226,232,240,.55)!important}
.primary,.logout-btn{
 border:1px solid rgba(255,255,255,.2)!important;border-radius:12px!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 25px rgba(0,0,0,.16)!important;
 transition:.2s!important;
}
.primary:hover,.logout-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.logout-btn{background:rgba(255,255,255,.10)!important;color:#fff!important}
table{border-collapse:separate!important;border-spacing:0!important;overflow:hidden}
th{
 background:rgba(15,23,42,.58)!important;color:#fff!important;
 border-bottom:1px solid var(--glass-line)!important;
}
td{
 background:rgba(255,255,255,.045)!important;color:#f8fafc!important;
 border-bottom:1px solid rgba(255,255,255,.10)!important;
}
tr:hover td{background:rgba(255,255,255,.10)!important}
.role-admin{color:#c4b5fd!important}
.role-staff{color:#7dd3fc!important}
.message{color:#fff}
@media(max-width:700px){
 .card{border-radius:18px!important}
 .nav{gap:6px}
 .nav a{font-size:13px;padding:8px 10px}
}
</style>

</head>
<body>

<div class="header">
  <h1>Haveeru Kulhun League</h1>
  <p>Staff Management</p>
  <div class="nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="players.html">👤 Players</a>
    <a href="index.html">➕ Daily Records</a>
    <a href="stats.html">📊 Statistics</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a href="staff.html">👥 Staff</a>
  </div>
</div>

<div class="staffbar">
  <span id="staffEmail" class="staff-email">Checking login...</span>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

  <div id="pageError" class="message"></div>

  <div class="card" id="addStaffCard" style="display:none;">
    <h2>➕ Add Staff</h2>
    <div class="form-grid">
      <div>
        <label for="newEmail">Staff Email</label>
        <input id="newEmail" type="email" placeholder="staff@example.com" autocomplete="off">
      </div>
      <div>
        <label for="newPassword">Temporary Password</label>
        <input id="newPassword" type="password" placeholder="Minimum 6 characters" autocomplete="new-password">
      </div>
      <button class="primary" id="addButton" onclick="createStaff()">Add Staff</button>
    </div>
    <div class="note">The account is created as Staff. Only the Admin can access this page.</div>
    <div id="createMessage" class="message"></div>
  </div>

  <div class="card">
    <h2>👥 Staff Accounts</h2>
    <div id="staffLoading" class="loading">Loading staff accounts...</div>
    <div class="table-wrapper">
      <table id="staffTable" style="display:none">
        <thead>
          <tr>
            <th>Email</th>
            <th>Role</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="staffBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://yafowakgpjvzapmejptn.supabase.co";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/staff-management";

function getAccessToken() {
  return localStorage.getItem("haveeru_access_token");
}

function getStoredUser() {
  try {
    return JSON.parse(localStorage.getItem("haveeru_user") || "null");
  } catch {
    return null;
  }
}

function showMessage(id, message, type) {
  const el = document.getElementById(id);
  el.className = "message " + type;
  el.textContent = message;
}

function clearMessage(id) {
  const el = document.getElementById(id);
  el.className = "message";
  el.textContent = "";
}

async function checkAdminAccess() {
  const token = getAccessToken();

  if (!token) {
    window.location.href = "login.html?return=staff.html";
    return false;
  }

  try {
    // The Edge Function is the authority for Admin access.
    // It verifies the access token and the staff_roles record.
    await callFunction({ action: "list" });

    const storedUser = getStoredUser();
    document.getElementById("staffEmail").textContent =
      storedUser?.email || "Admin";

    return true;

  } catch (error) {

    if (
      error.message === "Admin access required." ||
      error.message === "Admin access required"
    ) {
      // Valid logged-in Staff account, but not an Admin.
      window.location.href = "dashboard.html";
      return false;
    }

    if (
      error.message === "Invalid login session." ||
      error.message === "Invalid login session"
    ) {
      localStorage.removeItem("haveeru_access_token");
      localStorage.removeItem("haveeru_refresh_token");
      localStorage.removeItem("haveeru_user");

      window.location.href = "login.html?return=staff.html";
      return false;
    }

    document.getElementById("staffLoading").className = "error";
    document.getElementById("staffLoading").textContent =
      "Error checking Admin access: " + error.message;

    return false;
  }
}

async function callFunction(payload) {
  const token = getAccessToken();

  if (!token) {
    throw new Error("Not logged in.");
  }

  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  let data = {};
  try {
    data = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(data.error || "Request failed.");
  }

  return data;
}

async function loadStaff() {
  const loading = document.getElementById("staffLoading");
  const table = document.getElementById("staffTable");
  const body = document.getElementById("staffBody");

  loading.style.display = "block";
  table.style.display = "none";
  body.innerHTML = "";

  try {
    const data = await callFunction({ action: "list" });
    const users = data.users || [];

    if (!users.length) {
      body.innerHTML = '<tr><td colspan="4" class="empty">No staff accounts found.</td></tr>';
    } else {
      users.forEach(user => {
        const row = document.createElement("tr");

        const emailCell = document.createElement("td");
        emailCell.textContent = user.email || "No email";

        const roleCell = document.createElement("td");
        roleCell.textContent = user.role || "No role";
        roleCell.className =
          user.role === "admin" ? "role-admin" : "role-staff";

        const dateCell = document.createElement("td");
        dateCell.textContent = formatDateTime(user.created_at);

        const actionCell = document.createElement("td");

        if (user.role === "admin") {
          const span = document.createElement("span");
          span.textContent = "Protected";
          span.style.color = "#6b7280";
          actionCell.appendChild(span);
        } else {
          const button = document.createElement("button");
          button.className = "danger";
          button.textContent = "Remove";
          button.onclick = () => removeStaff(user.id, user.email);
          actionCell.appendChild(button);
        }

        row.appendChild(emailCell);
        row.appendChild(roleCell);
        row.appendChild(dateCell);
        row.appendChild(actionCell);
        body.appendChild(row);
      });
    }

    loading.style.display = "none";
    table.style.display = "table";
    document.getElementById("addStaffCard").style.display = "block";

  } catch (error) {
    if (error.message === "Admin access required.") {
      document.getElementById("addStaffCard").style.display = "none";
      window.location.href = "dashboard.html";
      return;
    }

    loading.className = "error";
    loading.textContent = "Error loading staff: " + error.message;
  }
}

async function createStaff() {
  clearMessage("createMessage");

  const email = document.getElementById("newEmail").value.trim();
  const password = document.getElementById("newPassword").value;

  if (!email) {
    showMessage("createMessage", "Enter the staff email.", "error");
    return;
  }

  if (password.length < 6) {
    showMessage(
      "createMessage",
      "Password must be at least 6 characters.",
      "error"
    );
    return;
  }

  const button = document.getElementById("addButton");
  button.disabled = true;
  button.textContent = "Creating...";

  try {
    await callFunction({
      action: "create",
      email,
      password
    });

    document.getElementById("newEmail").value = "";
    document.getElementById("newPassword").value = "";

    showMessage(
      "createMessage",
      "Staff account created successfully.",
      "success"
    );

    await loadStaff();

  } catch (error) {
    showMessage(
      "createMessage",
      error.message,
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "Add Staff";
  }
}

async function removeStaff(userId, email) {
  const confirmed = confirm(
    "Remove staff access for " + email + "?\n\n" +
    "This will permanently delete this Supabase login account."
  );

  if (!confirmed) return;

  try {
    await callFunction({
      action: "delete",
      user_id: userId
    });

    await loadStaff();

  } catch (error) {
    showMessage("pageError", error.message, "error");
  }
}

function formatDateTime(value) {
  if (!value) return "-";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "-";

  return date.toLocaleString("en-GB");
}

async function logout() {
  const token = getAccessToken();

  try {
    if (token) {
      await fetch(
        SUPABASE_URL + "/auth/v1/logout",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          }
        }
      );
    }
  } catch {}

  localStorage.removeItem("haveeru_access_token");
  localStorage.removeItem("haveeru_refresh_token");
  localStorage.removeItem("haveeru_user");

  window.location.href = "login.html?return=" + encodeURIComponent(location.pathname.split("/").pop() || "staff.html");
}

checkAdminAccess().then(isAdmin => {
  if (!isAdmin) return;
  loadStaff();
});
</script>

</body>
</html>
