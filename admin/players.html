<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haveeru Kulhun League - Players</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    color: #111827;
    margin-bottom: 5px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 15px;
}

/* =========================
   NAVIGATION
========================= */

.nav {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 15px 0 25px;
}

.nav a {
    color: white;
    text-decoration: none;
    background: #111827;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
}

.nav a:hover {
    background: #2563eb;
}

/* =========================
   CARDS
========================= */

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* =========================
   FORM
========================= */

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}

button {
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}

.save-btn {
    background: #2563eb;
    color: white;
}

.cancel-btn {
    background: #6b7280;
    color: white;
    margin-left: 8px;
}

.edit-btn {
    background: #f59e0b;
    color: white;
    margin: 0 5px 0 0;
}

.delete-btn {
    background: #dc2626;
    color: white;
    margin: 0;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

/* =========================
   PLAYERS
========================= */

.player {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.player:last-child {
    border-bottom: none;
}

.photo {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
}

.player-info {
    flex: 1;
}

.player-name {
    font-size: 18px;
    font-weight: bold;
}

.nickname {
    color: #6b7280;
    margin-top: 3px;
}

.phone {
    color: #6b7280;
    margin-top: 3px;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .nav {
        gap: 6px;
    }

    .nav a {
        font-size: 13px;
        padding: 8px 10px;
    }

    .player {
        align-items: flex-start;
    }

    .actions {
        flex-direction: column;
    }

    .edit-btn,
    .delete-btn {
        width: 75px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>Haveeru Kulhun League</h1>

    <div class="subtitle">
        Player Management
    </div>

    <!-- NAVIGATION -->

    <div class="nav">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="players.html">
            👤 Players
        </a>

        <a href="daily-records.html">
            ➕ Daily Records
        </a>

        <a href="stats.html">
            📊 Statistics
        </a>

        <a href="leaderboard.html">
            🏆 Leaderboard
        </a>

    </div>


    <!-- ADD / EDIT PLAYER -->

    <div class="card">

        <h2 id="formTitle">
            Add Player
        </h2>

        <label>
            Player Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter player name"
        >


        <label>
            Nickname
        </label>

        <input
            type="text"
            id="nickname"
            placeholder="Enter nickname"
        >


        <label>
            Phone
        </label>

        <input
            type="text"
            id="phone"
            placeholder="Enter phone number"
        >


        <label>
            Photo URL (optional)
        </label>

        <input
            type="text"
            id="photo"
            placeholder="Paste photo URL"
        >


        <button
            class="save-btn"
            onclick="savePlayer()"
            id="saveButton"
        >
            Add Player
        </button>


        <button
            class="cancel-btn"
            onclick="cancelEdit()"
            id="cancelButton"
            style="display:none;"
        >
            Cancel
        </button>


        <div
            class="message"
            id="message"
        ></div>

    </div>


    <!-- PLAYERS -->

    <div class="card">

        <h2>
            Players
        </h2>

        <div id="playersList">
            Loading players...
        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://yafowakgpjvzapmejptn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vOuJPPohicfbh8mFf-VQlA_jQ244rjs";


let editingPlayerId = null;


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers() {

    const list =
        document.getElementById("playersList");

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/Players?select=*&order=Name.asc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                }
            }
        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        const players =
            await response.json();


        list.innerHTML = "";


        if (players.length === 0) {

            list.innerHTML =
                "<p>No players registered yet.</p>";

            return;

        }


        players.forEach(player => {

            const div =
                document.createElement("div");

            div.className = "player";


            const photo =
                player.Photo_url
                    ? player.Photo_url
                    : "https://via.placeholder.com/100";


            div.innerHTML = `

                <img
                    class="photo"
                    src="${photo}"
                    onerror="
                        this.src='https://via.placeholder.com/100'
                    "
                >

                <div class="player-info">

                    <div class="player-name">
                        ${escapeHtml(
                            player.Name || ""
                        )}
                    </div>

                    <div class="nickname">

                        ${
                            player["Nick Name"]
                                ? "Nickname: " +
                                  escapeHtml(
                                      player["Nick Name"]
                                  )
                                : ""
                        }

                    </div>

                    <div class="phone">

                        ${
                            player.Phone
                                ? "Phone: " +
                                  escapeHtml(
                                      player.Phone
                                  )
                                : ""
                        }

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="edit-btn"
                        onclick="
                            editPlayer(${player.id})
                        "
                    >
                        Edit
                    </button>


                    <button
                        class="delete-btn"
                        onclick="
                            deletePlayer(${player.id})
                        "
                    >
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(div);

        });


    } catch (error) {

        list.innerHTML =
            `<p style="color:red;">
                Error loading players:
                ${escapeHtml(error.message)}
            </p>`;

    }

}


/* =========================
   SAVE PLAYER
========================= */

async function savePlayer() {

    const name =
        document.getElementById("name")
        .value
        .trim();


    const nickname =
        document.getElementById("nickname")
        .value
        .trim();


    const phone =
        document.getElementById("phone")
        .value
        .trim();


    const photo =
        document.getElementById("photo")
        .value
        .trim();


    const message =
        document.getElementById("message");


    if (!name) {

        message.style.color = "red";

        message.innerText =
            "Please enter the player name.";

        return;

    }


    const playerData = {

        Name: name,

        "Nick Name": nickname,

        Phone: phone,

        Photo_url: photo

    };


    try {

        let response;


        if (editingPlayerId === null) {

            /* ADD PLAYER */

            response = await fetch(
                `${SUPABASE_URL}/rest/v1/Players`,
                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify(
                            playerData
                        )

                }
            );


        } else {

            /* EDIT PLAYER */

            response = await fetch(
                `${SUPABASE_URL}/rest/v1/Players?id=eq.${editingPlayerId}`,
                {

                    method: "PATCH",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify(
                            playerData
                        )

                }
            );

        }


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        message.style.color =
            "green";


        message.innerText =
            editingPlayerId === null
                ? "Player added successfully!"
                : "Player updated successfully!";


        clearForm();


        loadPlayers();


    } catch (error) {

        message.style.color =
            "red";


        message.innerText =
            "Error: " +
            error.message;

    }

}


/* =========================
   EDIT PLAYER
========================= */

async function editPlayer(id) {

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/Players?id=eq.${id}&select=*`,
            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }
        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        const players =
            await response.json();


        if (players.length === 0) {

            alert(
                "Player not found."
            );

            return;

        }


        const player =
            players[0];


        editingPlayerId =
            player.id;


        document.getElementById("name")
            .value =
            player.Name || "";


        document.getElementById("nickname")
            .value =
            player["Nick Name"] || "";


        document.getElementById("phone")
            .value =
            player.Phone || "";


        document.getElementById("photo")
            .value =
            player.Photo_url || "";


        document.getElementById("formTitle")
            .innerText =
            "Edit Player";


        document.getElementById("saveButton")
            .innerText =
            "Update Player";


        document.getElementById("cancelButton")
            .style.display =
            "inline-block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    } catch (error) {

        alert(
            "Error loading player: " +
            error.message
        );

    }

}


/* =========================
   DELETE PLAYER
========================= */

async function deletePlayer(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this player?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/Players?id=eq.${id}`,
            {

                method: "DELETE",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }
        );


        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }


        loadPlayers();


        document.getElementById("message")
            .style.color =
            "green";


        document.getElementById("message")
            .innerText =
            "Player deleted successfully.";


    } catch (error) {

        alert(
            "Error deleting player: " +
            error.message
        );

    }

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    editingPlayerId =
        null;

    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    document.getElementById("name")
        .value = "";


    document.getElementById("nickname")
        .value = "";


    document.getElementById("phone")
        .value = "";


    document.getElementById("photo")
        .value = "";


    document.getElementById("formTitle")
        .innerText =
        "Add Player";


    document.getElementById("saveButton")
        .innerText =
        "Add Player";


    document.getElementById("cancelButton")
        .style.display =
        "none";


    editingPlayerId =
        null;

}


/* =========================
   SECURITY / DISPLAY HELPER
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   START
========================= */

loadPlayers();

</script>

</body>
</html>
