<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    color:#f8fafc;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
    radial-gradient(circle at 10% 10%,rgba(56,189,248,.30),transparent 32%),

    radial-gradient(circle at 50% 100%,rgba(14,165,233,.20),transparent 35%),
    linear-gradient(135deg,#07111f,#0b1220 48%,#111827);

    background-attachment:fixed;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.28;
    background-image:radial-gradient(
        rgba(255,255,255,.14) 1px,
        transparent 1px
    );
    background-size:24px 24px;

.login-card{

    z-index:1;

    );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),

    backdrop-filter:blur(28px) saturate(155%);
    -webkit-backdrop-filter:blur(28px) saturate(155%);
}

.logo{
    width:76px;
    height:76px;
    margin:0 auto 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:24px;
    font-size:40px;

    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.20);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        0 12px 30px rgba(0,0,0,.18);
}

h1{
    text-align:center;
    margin:0;
    color:#fff;
    font-size:27px;
}

.subtitle{
    text-align:center;
    color:rgba(226,232,240,.72);
    margin:9px 0 30px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
    color:#f8fafc;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    font-size:16px;

    background:rgba(255,255,255,.09);
    color:#fff;

    border:1px solid rgba(255,255,255,.22);
    border-radius:13px;

    outline:none;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

input:focus{
    border-color:rgba(255,255,255,.48);
    box-shadow:0 0 0 4px rgba(56,189,248,.12);
}

input::placeholder{
    color:rgba(226,232,240,.52);
}

button{
    width:100%;

    border:1px solid rgba(255,255,255,.22);

    background:
    linear-gradient(
        135deg,
        rgba(59,130,246,.85),
        rgba(99,102,241,.78)
    );

    color:white;
    padding:14px;
    border-radius:13px;

    font-size:16px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.20),
        0 12px 30px rgba(0,0,0,.20);

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:700;
}

.footer{
    text-align:center;
    color:rgba(226,232,240,.48);
    font-size:12px;
    margin-top:25px;
}

@media(max-width:500px){

    .login-card{
        padding:28px 22px;
        border-radius:22px;
    }

    h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">⚽</div>

    <h1>Haveeru Kulhun League</h1>

    <div class="subtitle">
        Staff Portal Login
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            🔐 Sign In
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="footer">
        Haveeru Kulhun League Staff Portal
    </div>

</div>

<script>

const SUPABASE_URL =
"https://yafowakgpjvzapmejptn.supabase.co";

/*

const SUPABASE_KEY =
"sb_publishable_vOuJPPohicfbh8mFf-VQlA_jQ244rjs";


function getReturnPage(){

}

        requested &&

    ){

}


function getAlreadyLoggedInPage(){

    const token =
        localStorage.getItem(
            "haveeru_access_token"
        );

    if(!token){

        return null;

    }

    return getReturnPage();
}


const destination =
    getReturnPage();


if(getAlreadyLoggedInPage()){

    window.location.replace(
        destination
    );

}


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        const button =
            document
            .getElementById("loginButton");

        const message =
            document
            .getElementById("message");


        button.disabled = true;

        button.innerText =
            "Signing in...";

        message.innerText = "";


        try{

            const response =
                await fetch(

                    `${SUPABASE_URL}/auth/v1/token?grant_type=password`,

                    {

                        method:"POST",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json"

                        },

                        body:JSON.stringify({

                            email:email,

                            password:password

                        })

                    }

                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(

                    data.error_description ||
                    data.msg ||
                    "Invalid email or password."

                );

            }


            localStorage.setItem(

                "haveeru_access_token",

                data.access_token

            );


            localStorage.setItem(

                "haveeru_refresh_token",

                data.refresh_token

            );


            localStorage.setItem(

                "haveeru_user",

                JSON.stringify(data.user)

            );


            message.style.color =
                "#4ade80";

            message.innerText =
                "Login successful. Opening portal...";


            setTimeout(

                function(){

                    window.location.replace(
                        destination
                    );

                },

                300

            );


        }catch(error){

            message.style.color =
                "#f87171";

            message.innerText =
                error.message;

            button.disabled =
                false;

            button.innerText =
                "🔐 Sign In";

        }

    }
);

</script>

</body>
</html>
